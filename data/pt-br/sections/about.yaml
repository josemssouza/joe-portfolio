# a summary about you
summary: |
  Aos 47 anos, não estou apenas aprendendo a codar. Estou unindo a disciplina de quem serviu ao Exército, a precisão matemática de um ex-eletricista, e a visão prática de quem já empreendeu, para construir softwares que resolvem problemas reais.
  
  Minha transição para a tecnologia não começou do zero; ela é sustentada por décadas de vivência lidando com pessoas e processos (de canteiros de obras ao atendimento ao público). Quando minha esposa, que é farmacêutica, precisou de uma solução para gerenciar o catálogo de cosméticos dela, eu não procurei um app pronto: **eu construí um**.
  
  Desenvolvi a **Ronaya Shop**, uma PWA (Progressive Web App) multi-inquilino do zero, integrando catálogo, carrinho de compras e gestão, hospedada na nuvem. Hoje, no 4º semestre de Análise e Desenvolvimento de Sistemas na UniFatecie, meu foco é dominar as melhores práticas de Engenharia de Software.
  
  Sou apaixonado por Linux, Open Source e por transformar regras de negócio complexas em telas limpas e sistemas rápidos.

