# a summary about you
summary: |
  At 47, I'm not just learning to code. I'm combining the discipline of someone who served in the Armed Forces, the mathematical precision of a former electrician, and the practical vision of an entrepreneur to build software that solves real-world problems.
  
  My transition to technology didn't start from scratch; it is supported by decades of experience dealing with people and processes (from construction sites to customer service). When my wife, who is a pharmacist, needed a solution to manage her cosmetics catalog, I didn't look for an off-the-shelf app: **I built one**.
  
  I developed **Ronaya Shop**, a multi-tenant PWA (Progressive Web App) from scratch, integrating a catalog, shopping cart, and management dashboard, fully hosted in the cloud. Today, in my 4th semester of Systems Analysis and Development at UniFatecie, my focus is mastering Software Engineering best practices.
  
  I am passionate about Linux, Open Source, and transforming complex business rules into clean interfaces and fast systems.

