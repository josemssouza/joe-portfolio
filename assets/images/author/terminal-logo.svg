<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Fundo preto do terminal com cantos arredondados e CONTORNO BRANCO -->
  <rect x="4" y="4" width="92" height="92" rx="14" fill="#000000" stroke="#ffffff" stroke-width="6" />
  
  <!-- Símbolo de Maior ( > ) em branco -->
